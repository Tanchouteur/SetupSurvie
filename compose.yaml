name: setupsurvie
services:
  open-webui:
    image: ${WEBUI_IMAGE:?Run the installer first}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      ENABLE_OPENAI_API: "false"
      ENABLE_WEB_SEARCH: "false"
      ENABLE_IMAGE_GENERATION: "false"
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      WEBUI_ADMIN_EMAIL: ${WEBUI_ADMIN_EMAIL}
      WEBUI_ADMIN_PASSWORD: ${WEBUI_ADMIN_PASSWORD}
      WEBUI_ADMIN_NAME: "Administration"
      WEBUI_AUTH_TRUSTED_EMAIL_HEADER: X-Survie-Email
      WEBUI_AUTH_TRUSTED_NAME_HEADER: X-Survie-Name
      WEBUI_AUTH_TRUSTED_ROLE_HEADER: X-Survie-Role
      ENABLE_LOGIN_FORM: "false"
      ENABLE_SIGNUP: "false"
      JWT_EXPIRES_IN: "30d"
      ENABLE_TITLE_GENERATION: "false"
      ENABLE_TAGS_GENERATION: "false"
      ENABLE_FOLLOW_UP_GENERATION: "false"
      ENABLE_AUTOCOMPLETE_GENERATION: "false"
      ENABLE_SEARCH_QUERY_GENERATION: "false"
      ENABLE_RETRIEVAL_QUERY_GENERATION: "false"
      ENABLE_CALENDAR: "false"
      ENABLE_AUTOMATIONS: "false"
      USER_PERMISSIONS_FEATURES_CALENDAR: "false"
      USER_PERMISSIONS_FEATURES_AUTOMATIONS: "false"
      USER_PERMISSIONS_FEATURES_CODE_INTERPRETER: "false"
      USER_PERMISSIONS_FEATURES_DIRECT_TOOL_SERVERS: "false"
      AUDIO_STT_ENGINE: ""
      WHISPER_MODEL: /app/backend/data/cache/whisper/faster-whisper-small
      WHISPER_MODEL_AUTO_UPDATE: "false"
      WHISPER_COMPUTE_TYPE: int8
      DEFAULT_LOCALE: fr-FR
      DEFAULT_MODELS: survie-rapide
      DEFAULT_USER_ROLE: user
      OFFLINE_MODE: "true"
      HF_HUB_OFFLINE: "1"
      TIKTOKEN_CACHE_DIR: /app/backend/data/cache/tiktoken
      RAG_EMBEDDING_ENGINE: ""
      RAG_EMBEDDING_MODEL: /app/backend/data/cache/embedding/bge-m3
      RAG_EMBEDDING_MODEL_AUTO_UPDATE: "false"
      RAG_EMBEDDING_MODEL_TRUST_REMOTE_CODE: "false"
      RAG_RERANKING_MODEL_AUTO_UPDATE: "false"
      ENABLE_VERSION_UPDATE_CHECK: "false"
      ENABLE_PERSISTENT_CONFIG: "false"
      VECTOR_DB: chroma
    volumes:
      - type: bind
        source: ${DATA_DIR}/state/openwebui
        target: /app/backend/data
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 60s
  kiwix:
    image: ${KIWIX_IMAGE}
    restart: unless-stopped
    init: true
    entrypoint: ["/bin/sh", "/config/kiwix-entrypoint.sh"]
    command: []
    ports:
      - "${BIND_ADDRESS}:8081:8080"
    volumes:
      - ./deploy/kiwix-entrypoint.sh:/config/kiwix-entrypoint.sh:ro
      - type: bind
        source: ${DATA_DIR}/library/zim
        target: /data
        read_only: true
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s
  pilot:
    image: ${WEBUI_IMAGE}
    restart: unless-stopped
    working_dir: /srv
    entrypoint: [python, -m, uvicorn, pilot.app:app, --host, "0.0.0.0", --port, "8000"]
    command: []
    environment:
      PILOT_STATE_DIR: /pilot-data
      WEBUI_DB_PATH: /webui-data/webui.db
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      WEBUI_URL: http://open-webui:8080
      PILOT_CONTROL_URL: http://host.docker.internal:11436
      PILOT_CONTROL_TOKEN: ${PILOT_CONTROL_TOKEN}
      OLLAMA_URL: ${OLLAMA_BASE_URL}
      KIWIX_URL: http://kiwix:8080
      PILOT_SEARCH_CACHE_BYTES: ${PILOT_SEARCH_CACHE_BYTES:-2000000000}
      GUIDES_DIR: /guides
      ASSISTANT_POLICY: /srv/system.fr.txt
    volumes:
      - ./pilot:/srv/pilot:ro
      - ./deploy/assistant-system.fr.txt:/srv/system.fr.txt:ro
      - ./deploy/model-profiles.json:/srv/model-profiles.json:ro
      - ./deploy/kiwix-themes.json:/srv/kiwix-themes.json:ro
      - ${DATA_DIR}/state/pilot:/pilot-data
      - ${DATA_DIR}/state/openwebui:/webui-data:ro
      - ${DATA_DIR}/library/guides:/guides
      - ${DATA_DIR}/library/maps:/maps:ro
      - ${DATA_DIR}/library/zim:/zim:ro
      - ${DATA_DIR}/models:/models:ro
      - ${DATA_DIR}/catalog:/catalog:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 15s
  portal:
    image: ${PORTAL_IMAGE}
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS}:8080:8080"
      - "${BIND_ADDRESS}:3000:3000"
      - "${BIND_ADDRESS}:8443:8443"
      - "${BIND_ADDRESS}:8444:8444"
      - "${BIND_ADDRESS}:8445:8445"
    environment:
      TLS_PORTAL_ADDRESSES: ${TLS_PORTAL_ADDRESSES}
      TLS_WEBUI_ADDRESSES: ${TLS_WEBUI_ADDRESSES}
      TLS_KIWIX_ADDRESSES: ${TLS_KIWIX_ADDRESSES}
      TLS_FALLBACK_HOST: ${TLS_FALLBACK_HOST}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./portal:/srv/portal:ro
      - ${DATA_DIR}/catalog:/srv/catalog:ro
      - ${DATA_DIR}/library/guides:/srv/guides:ro
      - ${DATA_DIR}/state/caddy:/data
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
  router-foot:
    image: ${ROUTING_IMAGE:-ghcr.io/project-osrm/osrm-backend:v6.0.0@sha256:729461bcc9ae9e6aafa92c0f93db9b060a32e85d5e72092c01ae4a4a9f1eb564}
    profiles: [routing]
    restart: unless-stopped
    command: [osrm-routed, --algorithm, mld, --threads, "1", /data/network.osrm]
    volumes:
      - type: bind
        source: ${DATA_DIR}/library/maps/routing/current/foot
        target: /data
        read_only: true
    mem_limit: 2g
    cpus: 1
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  router-motorcycle:
    image: ${ROUTING_IMAGE:-ghcr.io/project-osrm/osrm-backend:v6.0.0@sha256:729461bcc9ae9e6aafa92c0f93db9b060a32e85d5e72092c01ae4a4a9f1eb564}
    profiles: [routing]
    restart: unless-stopped
    command: [osrm-routed, --algorithm, mld, --threads, "1", /data/network.osrm]
    volumes:
      - type: bind
        source: ${DATA_DIR}/library/maps/routing/current/motorcycle
        target: /data
        read_only: true
    mem_limit: 2g
    cpus: 1
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  router-car:
    image: ${ROUTING_IMAGE:-ghcr.io/project-osrm/osrm-backend:v6.0.0@sha256:729461bcc9ae9e6aafa92c0f93db9b060a32e85d5e72092c01ae4a4a9f1eb564}
    profiles: [routing]
    restart: unless-stopped
    command: [osrm-routed, --algorithm, mld, --threads, "1", /data/network.osrm]
    volumes:
      - type: bind
        source: ${DATA_DIR}/library/maps/routing/current/car
        target: /data
        read_only: true
    mem_limit: 2g
    cpus: 1
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
