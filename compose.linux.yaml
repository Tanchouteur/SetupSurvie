services:
  ollama:
    image: ${OLLAMA_IMAGE}
    restart: unless-stopped
    ports:
      - "127.0.0.1:11435:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ${DATA_DIR}/models:/root/.ollama/models
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 5s
      retries: 10
