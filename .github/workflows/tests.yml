name: Tests du pilote
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - run: docker compose version
      - run: docker run --rm -i caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d caddy adapt --config - --adapter caddyfile --validate < deploy/Caddyfile
      - run: python -m pip install -r scripts/requirements-index.txt
      - run: python -m unittest discover -s tests -v
      - run: python tests/search_processing_smoke.py
      - run: python tests/profile_proxy_smoke.py
      - run: python scripts/pilot_update.py build dist/setupsurvie-update.zip
      - uses: actions/upload-artifact@v4
        with:
          name: logiciel-et-empreinte
          path: dist/*
  windows-transfers-and-updates:
    runs-on: windows-latest
    env:
      # Match the Windows launchers, which invoke Python with -X utf8.
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/windows_installers.ps1
      - run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/windows_updates.ps1
      - run: python -m unittest discover -s tests -p test_transfer.py -v
      - run: python -m unittest discover -s tests -p test_transfer_readiness.py -v
      - run: python -m unittest discover -s tests -p test_transfer_windows.py -v
      - run: python -m unittest discover -s tests -p test_windows_update.py -v
      - run: python -m unittest discover -s tests -p test_windows_resume.py -v
      - run: python -m unittest discover -s tests -p test_windows_autostart.py -v
      - run: python -m unittest discover -s tests -p test_install_wizard.py -v
      - run: python -m unittest discover -s tests -p test_content.py -v
      - run: python -m unittest discover -s tests -p test_content_retry.py -v
      - run: python -m unittest discover -s tests -p test_content_mirrors.py -v
      - run: python -m unittest discover -s tests -p test_windows_publish.py -v
      - run: python -m unittest discover -s tests -p test_kiwix_select.py -v
      - run: python -m pip install -r scripts/requirements-index.txt
      - run: python -m unittest discover -s tests -p test_search_index_queue.py -v
      - run: python -m unittest discover -s tests -p test_search_index_tools.py -v
      - run: python -m unittest discover -s tests -p test_index_reader_probe.py -v
      - run: python -m unittest discover -s tests -p test_runtime_resources.py -v
      - run: python -m unittest discover -s tests -p test_kiwix_catalog.py -v
      - run: python -m unittest discover -s tests -p test_archive_index.py -v
      - run: python -m unittest discover -s tests -p test_search_marc_report.py -v
      - run: python -m unittest discover -s tests -p test_search_report093.py -v
      - run: python -m unittest discover -s tests -p test_search_report0100.py -v
      - run: python -m unittest discover -s tests -p test_search_progress.py -v
      - run: python -m unittest discover -s tests -p test_search_processing.py -v
      - run: python -m unittest discover -s tests -p test_search_refinement_budget.py -v
      - run: python -m unittest discover -s tests -p test_search_title_scope.py -v
      - run: python -m unittest discover -s tests -p test_search_experiment.py -v
      - run: python -m unittest discover -s tests -p test_search_failures.py -v
      - run: python -m unittest discover -s tests -p test_operations_diagnostic.py -v
      - run: python -m unittest discover -s tests -p test_practical.py -v
      - run: python -m unittest discover -s tests -p test_kiwix_search.py -v
      - run: python -m unittest discover -s tests -p test_search_relevance.py -v
      - run: python -m unittest discover -s tests -p test_search_title_intent.py -v
      - run: python -m unittest discover -s tests -p test_kiwix_diagnostic.py -v
      - run: python -m unittest discover -s tests -p test_library_videos.py -v
      - run: python -m unittest discover -s tests -p test_search_reference.py -v
      - run: python -m unittest discover -s tests -p test_catalogue.py -v
      - run: python -m unittest discover -s tests -p test_library_redirects.py -v
      - run: python -m unittest discover -s tests -p test_library_monitor.py -v
      - run: python -m unittest discover -s tests -p test_next_portal.py -v
      - run: python -m unittest discover -s tests -p test_library_tasks.py -v
      - run: python -m unittest discover -s tests -p test_windows_shortcuts.py -v
      - run: python -m unittest discover -s tests -p test_pilot_update.py -v
      - run: python -m unittest discover -s tests -p test_pilot_delivery.py -v
      - run: python -m unittest discover -s tests -p test_setup.py -v
      - run: python -m unittest discover -s tests -p test_power_loss.py -v
      - run: python -m unittest discover -s tests -p test_pilot_api.py -v
      - run: python -m unittest discover -s tests -p test_profiles.py -v
      - run: python -m unittest discover -s tests -p test_translations.py -v
      - run: python -m unittest discover -s tests -p test_translation_runtime.py -v
      - run: python -m unittest discover -s tests -p test_host_performance.py -v
      - run: python -m unittest discover -s tests -p test_library_videos.py -v
      - run: python -m unittest discover -s tests -p test_local_videos.py -v
      - run: python -m unittest discover -s tests -p test_caption_preparation.py -v
      - run: python -m unittest discover -s tests -p test_video_transcriptions.py -v
      - run: python -m unittest discover -s tests -p test_speech_worker.py -v
      - run: python -m unittest discover -s tests -p test_translation_benchmark.py -v
      - run: python -m unittest discover -s tests -p test_performance.py -v
      - run: python -m unittest discover -s tests -p test_control.py -v
      - run: python -m unittest discover -s tests -p test_startup_diagnostic.py -v
      - run: python -m unittest discover -s tests -p test_translation_reader.py -v
      - run: python -m unittest discover -s tests -p test_translation_long_book.py -v
      - run: python -m unittest discover -s tests -p test_translation_quality.py -v
      - run: python -m unittest discover -s tests -p test_translation_terms.py -v
      - run: python -m unittest discover -s tests -p test_document_library.py -v
      - run: python -m unittest discover -s tests -p test_pdf_assets.py -v
      - run: python -m unittest discover -s tests -p test_source_metadata.py -v
      - run: python -m unittest discover -s tests -p test_engine_evidence.py -v
      - run: python -m unittest discover -s tests -p test_conversation_context.py -v
      - run: python -m unittest discover -s tests -p test_procedure_review.py -v
      - run: python -m unittest discover -s tests -p test_tool_protocol.py -v
      - run: python -m unittest discover -s tests -p test_model_session.py -v
      - run: python -m unittest discover -s tests -p test_research.py -v
      - run: python -m unittest discover -s tests -p "test_illustration*.py" -v
      - run: python -m unittest discover -s tests -p test_associations.py -v
      - run: python -m unittest discover -s tests -p "test_summar*.py" -v
      - run: python -m unittest discover -s tests -p test_citation_links.py -v
      - run: python -m unittest discover -s tests -p test_real_assistant_check.py -v
      - run: python -m unittest discover -s tests -p test_real_documentary_cases.py -v
      - run: python -m unittest discover -s tests -p test_html_main_content.py -v
      - run: python -m unittest discover -s tests -p test_documentary_evidence.py -v
      - run: python -m unittest discover -s tests -p test_documentary_requests.py -v
      - run: python -m unittest discover -s tests -p test_calibration.py -v
      - run: python -m unittest discover -s tests -p test_learning.py -v
      - run: python -m unittest discover -s tests -p test_audit_selection.py -v
  isolated-index-reader:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The main Windows job covers 3.12; exercise the other kit targets here.
        python-version: ['3.11', '3.13', '3.14']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r tests/requirements.txt -r scripts/requirements-index.txt
      - run: python -m unittest discover -s tests -p test_archive_index.py -k IsolatedArchiveIndexTests -v
  kiwix-search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements-kiwix.txt
      # Only locally generated synthetic archives, never a downloaded corpus/LLM.
      - run: python tests/kiwix_search_smoke.py --output /tmp/kiwix-search-receipt.json
      - run: python tests/kiwix_scale_smoke.py --output /tmp/kiwix-scale-receipt.json
  offline-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      # Pinned OSRM image + tiny synthetic road graph; no corpus or LLM.
      - run: python tests/routing_smoke.py
  maps-interface:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/setupsurvie-browser playwright@1.58.2
      - run: /tmp/setupsurvie-browser/node_modules/.bin/playwright install --with-deps chromium webkit
      - run: node tests/browser_maps_runner.cjs
      - run: python -m pip install -r tests/requirements.txt
      - run: node tests/browser_translations_runner.cjs
