name: Tests du pilote
on:
  # Branches are tested through their pull request: one run per change.
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  linux:
    name: Python et paquet logiciel (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements-kiwix.txt
      - name: Suite Python et configurations Compose
        run: python -m unittest discover -s tests -v --durations 10
      - name: Configuration Caddy
        run: docker run --rm -i caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d caddy adapt --config - --adapter caddyfile --validate < deploy/Caddyfile
      - run: python tests/search_processing_smoke.py
      - run: python tests/profile_proxy_smoke.py
      - name: Construire et relire le paquet logiciel
        run: |
          python scripts/pilot_update.py build dist/setupsurvie-update.zip
          python - <<'PYTHON'
          import sys
          from pathlib import Path
          from tempfile import TemporaryDirectory

          sys.path.insert(0, 'scripts')
          from pilot_update import unpack

          package = Path('dist/setupsurvie-update.zip')
          digest = package.with_suffix('.zip.sha256').read_text(encoding='utf-8').split()[0]
          with TemporaryDirectory() as destination:
              manifest = unpack(package, digest, Path(destination))
          print(f"Paquet relu : {manifest['release']['version']}, {len(manifest['files'])} fichiers vérifiés")
          PYTHON
      - name: Construire et contrôler l’installateur Linux
        run: |
          version=$(python -c "import json; print(json.load(open('deploy/release.json'))['version'])")
          archive="SetupSurvie-linux-${version}.tar.gz"
          git archive --format=tar.gz --prefix=SetupSurvie/ --output="dist/$archive" HEAD
          unpacked=$(mktemp -d)
          tar -xzf "dist/$archive" -C "$unpacked"
          test -x "$unpacked/SetupSurvie/scripts/install.sh"
          "$unpacked/SetupSurvie/scripts/install.sh" --preparer-systeme --help
          (cd dist && sha256sum "$archive" > "$archive.sha256")
      - uses: actions/upload-artifact@v7
        with:
          name: logiciel-et-empreinte
          path: dist/*
          if-no-files-found: error
  windows-transfers-and-updates:
    name: Python et lanceurs (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      # Match the Windows launchers, which invoke Python with -X utf8.
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - id: dependencies
        run: python -m pip install -r tests/requirements-kiwix.txt
      - name: Installation PowerShell
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/windows_installers.ps1
      - name: Suite Python et configurations Compose
        run: python -m unittest discover -s tests -v --durations 10
      - name: Mise à jour PowerShell
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/windows_updates.ps1
      - name: Démarrage des outils YouTube
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python -X utf8 tests/youtube_tools_smoke.py
  isolated-index-reader:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The main Windows job covers 3.12; exercise the other kit targets here.
        python-version: ['3.11', '3.13', '3.14']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r tests/requirements.txt -r scripts/requirements-index.txt
      - run: python -m unittest discover -s tests -p test_archive_index.py -k IsolatedArchiveIndexTests -v
  kiwix-search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements-kiwix.txt
      # Only locally generated synthetic archives, never a downloaded corpus/LLM.
      - run: python -m unittest discover -s tests -p 'test_archive_video*.py' -v
      - run: python -m unittest discover -s tests -p 'test_zim_video_inventory.py' -v
      - run: python tests/kiwix_search_smoke.py --output /tmp/kiwix-search-receipt.json
      - run: python tests/kiwix_scale_smoke.py --output /tmp/kiwix-scale-receipt.json
      - run: python tests/kiwix_video_smoke.py --output /tmp/kiwix-video-receipt.json
  offline-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      # Pinned OSRM image + tiny synthetic road graph; no corpus or LLM.
      - run: python tests/routing_smoke.py
  browser-scope:
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.scope.outputs.needed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # Unknown differences stay on the safe side: run the browser tests.
          needed=true
          if [ "$EVENT" = pull_request ] && changed=$(git diff --name-only --no-renames HEAD^1 HEAD); then
            if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -Eqv '^(docs/|README\.md$|AGENTS\.md$)'; then needed=false; fi
          fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
  maps-interface:
    name: Portail et cartes (${{ matrix.engine }})
    needs: browser-scope
    if: needs.browser-scope.outputs.needed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Browsers and their system libraries are already in this pinned image.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit, firefox]
    env:
      BROWSER_ENGINE: ${{ matrix.engine }}
      # Firefox refuses a home folder owned by another user in job containers.
      HOME: /root
      BROWSER_ARTIFACTS: /tmp/setupsurvie-browser-results
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - id: playwright
        run: npm install --prefix /tmp/setupsurvie-browser playwright@1.58.2
      - id: dependencies
        run: python -m pip install -r tests/requirements-kiwix.txt
      - name: Cartes hors ligne
        if: matrix.engine != 'firefox'
        run: node tests/browser_maps_runner.cjs
      - name: Parcours du portail
        if: ${{ !cancelled() && steps.playwright.outcome == 'success' && steps.dependencies.outcome == 'success' }}
        run: node tests/browser_translations_runner.cjs
      - name: Publier les captures du portail
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: navigateur-${{ matrix.engine }}
          path: ${{ env.BROWSER_ARTIFACTS }}
          retention-days: 7
